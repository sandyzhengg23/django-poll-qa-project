name: QA Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: pollme.settings

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest pytest-django pytest-cov pytest-playwright

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Set up database
        run: |
          python manage.py migrate

      - name: Run linter
        run: |
          ruff check .

      - name: Run unit tests with coverage
        run: |
          mkdir -p reports/coverage
          python -m pytest tests/unit \
            --cov=accounts \
            --cov=polls \
            --cov-report=term-missing \
            --cov-report=html:reports/coverage/htmlcov

      - name: Run integration tests
        run: |
          python -m pytest tests/integration

      - name: Start Django server
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 > django.log 2>&1 &
          echo $! > django.pid

          for i in {1..15}; do
            if curl -s --fail http://127.0.0.1:8000/ > /dev/null; then
              echo "Django server is running"
              exit 0
            fi
            echo "Waiting for Django server..."
            sleep 2
          done

          echo "Django server failed to start"
          cat django.log
          exit 1

      - name: Run performance load test
        run: |
          k6 run performance/load_test.js

      - name: Run performance spike test
        run: |
          k6 run performance/spike_test.js

      - name: Run UI automation tests
        run: |
          python -m pytest tests/ui

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage/htmlcov

      - name: Upload Django server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-server-log
          path: django.log

      - name: Stop Django server
        if: always()
        run: |
          if [ -f django.pid ]; then
            kill $(cat django.pid) || true
          fi